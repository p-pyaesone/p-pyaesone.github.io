<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <label for="Name">Name</label>
        <input type="text" name="stuName" id="name">
        <br><br>
        <label for="email">Email</label>
        <input type="emial" name="stuEmail" id="email">
        <br><br>
        <label for="password">Password</label>
        <input type="password" name="stuPassword" id="Password">
        <br><br>
        <label for="Phone">Phone</label>
        <input type="number" name="stuPhone" id="phone">
        <br><br>
        <label for="dob">Date of Birth</label>
        <input type="date" name="stuDOB" id="dob">
        <br><br>
        <label for="passport">Passport</label>
        <input type="file" accept=".jpg,.png" name="stuPassport" id="passport">
        <br><br>
        <label for="year">Year</label>
        <select name="stuYear" id="year">
            <option value="">Choose Year</option>
            <option value="1">First Year</option>
            <option value="2">Second Year</option>
            <option value="3">Third Year</option>
        </select>
        <br><br>
        <label for="">Gender</label>
        <br>
        <input type="radio" name="gender" id="male"><label for="male">Male</label>
        <input type="radio" name="gender" id="female"><label for="female">Female</label>
        <br><br>
        <label for="">Hobby</label>
        <br>
        <input type="checkbox" name="travelling" id="travelling" value="Travelling"><label for="travelling">Travelling</label>
        <input type="checkbox" name="gaming" id="gaming" value="gaming"><label for="gaming">Gaming</label>
        <input type="checkbox" name="reading" id="reading" value="reading"><label for="reading">Reading</label>
        <br><br>
        <label for="address">Address</label>
        <textarea name="stuAddress" id="address"></textarea>
        <br><br>
        <input type="text" name="city1" id="" value="Mandalay">
        <input type="text" name="city2" id="" value="Yangon">
        <input type="text" name="" id="" required>
        <input type="text" name="" id="" placeholder="phupyaesone@gmail.com">
        <input type="time" name="" id="">
        <input type="color" name="" id="">
        <input type="range" name="" id="">
        <br><br>
        <button type="submit">Save</button>
    </form>
</body>
</html>
