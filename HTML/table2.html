<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Bouncher</h1>
    <table border="1" cellspacing="0" cellpadding="25">
        <thead>
            <tr>
               <th>No.</th>
               <th>Item Name</th>
               <th>Price</th>
               <th>Qty</th>
               <th>Amount</th>
            </tr>
            <tr>
                <td>1</td>
                <td>Cookie</td>
                <td>5000</td>
                <td>3</td>
                <td>15000</td>
            </tr>
            <tr>
                <td>2</td>
                <td>Milk</td>
                <td>4500</td>
                <td>1</td>
                <td>4500</td>
            </tr>
            <tr>
                <td>3</td>
                <td>Water</td>
                <td>1000</td>
                <td>2</td>
                <td>2000</td>
            </tr>
        </thead>
        <tfoot>
            <tr>
                <td colspan="4" align="center">Total</td>
                <td>21500</td>
            </tr>
        </tfoot>
    </table>

    <h1>Save Money</h1>
    <table border="1" cellspacing="0" cellpadding="25">
        <tr>
            <th>Months</th>
            <th>Save Money</th>
            <th>Amount</th>
        </tr>
        <tr>
            <td>January</td>
            <td>150000</td>
            <td rowspan="3">200000</td>
        </tr>
        <tr>
            <td>Febuary</td>
            <td>50000</td>
        </tr>

    </table>
</body>
</html>
